<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#05070c">
<title>Zidane's Mühle — Intro</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
  html,body{ margin:0; height:100%; background:#05070c; overflow:hidden;
    font-family:ui-rounded,"SF Pro Rounded",system-ui,sans-serif;
    -webkit-user-select:none; user-select:none; -webkit-tap-highlight-color:transparent; }
  #c{ position:fixed; inset:0; width:100%; height:100%; display:block; }
  .vig{ position:fixed; inset:0; pointer-events:none;
    background:radial-gradient(ellipse at 50% 45%, transparent 52%, rgba(0,0,0,.72) 100%); }
  #flash{ position:fixed; inset:0; background:#cfe0ff; opacity:0; pointer-events:none; transition:opacity .45s ease-out; }

  #titleWrap{ position:fixed; inset:0; display:flex; flex-direction:column; align-items:center;
    justify-content:center; text-align:center; pointer-events:none; opacity:0; transition:opacity 1.6s ease;
    padding:0 20px; }
  #titleWrap.show{ opacity:1; }
  #title{ font-family:Luminari,Copperplate,"Copperplate Gothic",Trattatello,fantasy;
    font-size:clamp(34px,10vw,64px); letter-spacing:.06em; line-height:1.1;
    background:linear-gradient(180deg,#fff3c4,#f0c75e 45%,#9a6b1f);
    -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;
    filter:drop-shadow(0 0 16px rgba(240,199,94,.4)) drop-shadow(0 2px 2px rgba(0,0,0,.85));
    animation:trackIn 4s ease both; }
  @keyframes trackIn{ from{ letter-spacing:.3em; opacity:0; transform:scale(1.07); }
    25%{ opacity:1; } to{ letter-spacing:.06em; transform:scale(1); } }
  #subtitle{ margin-top:12px; color:#b9c4d8; font-weight:700; font-size:13px;
    letter-spacing:.34em; text-transform:uppercase; opacity:.85; }
  #playBtn{ pointer-events:auto; margin-top:36px; cursor:pointer;
    border:2px solid rgba(240,199,94,.55);
    background:linear-gradient(180deg,rgba(240,199,94,.18),rgba(240,199,94,.05));
    color:#f0c75e; font-family:inherit; font-weight:900; font-size:18px;
    padding:14px 30px; border-radius:999px; letter-spacing:.08em;
    opacity:0; transform:translateY(14px); transition:opacity .8s ease, transform .8s ease;
    box-shadow:0 0 26px rgba(240,199,94,.28), inset 0 0 12px rgba(240,199,94,.12); }
  #playBtn.show{ opacity:1; transform:none; }
  #playBtn:active{ transform:scale(.96); }

  #skip{ position:fixed; z-index:4; top:calc(env(safe-area-inset-top,0px) + 12px); right:16px;
    color:#8b96ab; background:rgba(10,14,22,.55); border:1px solid rgba(139,150,171,.35);
    border-radius:999px; padding:8px 14px; font-size:13px; font-weight:800;
    text-decoration:none; letter-spacing:.04em; opacity:0; transition:opacity .6s; }
  #skip.show{ opacity:1; }

  #gate{ position:fixed; inset:0; z-index:5; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:16px; cursor:pointer;
    background:radial-gradient(120% 80% at 50% 18%, #101826, #05070c 70%); }
  #gate .flag{ font-size:64px; filter:drop-shadow(0 8px 20px rgba(0,0,0,.7));
    animation:bob 3s ease-in-out infinite; }
  @keyframes bob{ 0%,100%{ transform:translateY(0) rotate(-3deg); } 50%{ transform:translateY(-10px) rotate(3deg); } }
  #gate h1{ font-family:Luminari,Copperplate,fantasy; color:#f0c75e; font-size:26px;
    letter-spacing:.12em; margin:0; text-align:center; }
  #gate p{ color:#8b96ab; font-weight:700; letter-spacing:.3em; font-size:12px;
    text-transform:uppercase; margin:0; animation:pulseTxt 1.6s ease-in-out infinite; }
  @keyframes pulseTxt{ 50%{ opacity:.3; } }
  #gate.hide{ display:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="vig"></div>
<div id="flash"></div>
<a id="skip" href="index.html">&Uuml;berspringen &rsaquo;</a>

<div id="titleWrap">
  <div id="title">ZIDANE&rsquo;S M&Uuml;HLE</div>
  <div id="subtitle">Ein Piraten-Abenteuer</div>
  <button id="playBtn">&#9876;&#65039; Jetzt spielen</button>
</div>

<div id="gate">
  <div class="flag">&#127988;&#8205;&#9760;&#65039;</div>
  <h1>ZIDANE&rsquo;S M&Uuml;HLE</h1>
  <p>Tippen f&uuml;r das Intro</p>
</div>

<script src="three.min.js"></script>
<script>
(function(){
"use strict";

/* ═══════════ Renderer / scene ═══════════ */
var W=innerWidth, H=innerHeight;
var renderer=new THREE.WebGLRenderer({canvas:document.getElementById("c"), antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(W,H);
renderer.outputEncoding=THREE.sRGBEncoding;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.1;

var scene=new THREE.Scene();
scene.fog=new THREE.FogExp2(0x070a12, 0.018);
var camera=new THREE.PerspectiveCamera(55, W/H, 0.1, 400);
camera.position.set(0,3.2,26);

addEventListener("resize", function(){
  W=innerWidth; H=innerHeight;
  camera.aspect=W/H; camera.updateProjectionMatrix();
  renderer.setSize(W,H);
});

/* ═══════════ Lights ═══════════ */
scene.add(new THREE.AmbientLight(0x2a3a55, 0.55));
var moonLight=new THREE.DirectionalLight(0x9fb4d8, 1.0);
moonLight.position.set(-30,40,-60); scene.add(moonLight);
var goldLight=new THREE.PointLight(0xffc53d, 0, 26);
goldLight.position.set(0,5,2); scene.add(goldLight);
var boltLight=new THREE.PointLight(0xcfe0ff, 0, 200);
boltLight.position.set(10,45,-40); scene.add(boltLight);

/* ═══════════ Sky, moon, clouds ═══════════ */
scene.add(new THREE.Mesh(
  new THREE.SphereGeometry(180,24,16),
  new THREE.ShaderMaterial({
    side:THREE.BackSide, depthWrite:false,
    vertexShader:"varying vec3 vP;void main(){vP=position;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}",
    fragmentShader:"varying vec3 vP;void main(){float h=normalize(vP).y*0.5+0.5;vec3 top=vec3(0.006,0.010,0.026);vec3 low=vec3(0.05,0.07,0.115);gl_FragColor=vec4(mix(low,top,pow(h,0.65)),1.0);}"
  })
));

function radialTex(inner, outer){
  var cv=document.createElement("canvas"); cv.width=cv.height=256;
  var g=cv.getContext("2d");
  var gr=g.createRadialGradient(128,128,10,128,128,128);
  gr.addColorStop(0,inner); gr.addColorStop(1,outer);
  g.fillStyle=gr; g.fillRect(0,0,256,256);
  var t=new THREE.CanvasTexture(cv); return t;
}
var moon=new THREE.Mesh(new THREE.CircleGeometry(8,40),
  new THREE.MeshBasicMaterial({color:0xe6edf8, fog:false}));
moon.position.set(-34,42,-140); moon.lookAt(0,3,26);
scene.add(moon);
var moonGlow=new THREE.Sprite(new THREE.SpriteMaterial({
  map:radialTex("rgba(205,220,245,0.5)","rgba(205,220,245,0)"),
  blending:THREE.AdditiveBlending, depthWrite:false, fog:false }));
moonGlow.scale.set(58,58,1); moonGlow.position.copy(moon.position);
scene.add(moonGlow);

function cloudTex(){
  var cv=document.createElement("canvas"); cv.width=256; cv.height=128;
  var g=cv.getContext("2d");
  g.filter="blur(12px)";
  for(var i=0;i<16;i++){
    var a=0.10+Math.random()*0.16;
    g.fillStyle="rgba(235,240,250,"+a+")";
    g.beginPath();
    g.ellipse(70+Math.random()*116, 45+Math.random()*38, 22+Math.random()*38, 10+Math.random()*16, 0, 0, 6.283);
    g.fill();
  }
  /* fade the plane edges so cloud quads never show hard borders */
  g.filter="none";
  g.globalCompositeOperation="destination-in";
  var mask=g.createRadialGradient(128,64,20,128,64,120);
  mask.addColorStop(0,"rgba(0,0,0,1)");
  mask.addColorStop(0.7,"rgba(0,0,0,0.85)");
  mask.addColorStop(1,"rgba(0,0,0,0)");
  g.fillStyle=mask; g.fillRect(0,0,256,128);
  return new THREE.CanvasTexture(cv);
}
var clouds=[];
var cloudMat=new THREE.MeshBasicMaterial({map:cloudTex(), transparent:true, opacity:0.38,
  depthWrite:false, fog:false, color:0x39435c});
for(var ci=0; ci<5; ci++){
  var cl=new THREE.Mesh(new THREE.PlaneGeometry(70,26), cloudMat);
  cl.position.set(-90+Math.random()*180, 32+Math.random()*16, -122+Math.random()*20);
  clouds.push({m:cl, v:0.25+Math.random()*0.45});
  scene.add(cl);
}

/* ═══════════ Ocean ═══════════ */
var OSEG=96;
var oceanGeo=new THREE.PlaneGeometry(360,360,OSEG,OSEG);
oceanGeo.rotateX(-Math.PI/2);
var ocean=new THREE.Mesh(oceanGeo,
  new THREE.MeshStandardMaterial({color:0x091820, metalness:0.3, roughness:0.55}));
scene.add(ocean);
var oPos=oceanGeo.attributes.position;
var oBase=[];
for(var vi=0; vi<oPos.count; vi++) oBase.push(oPos.getX(vi), oPos.getZ(vi));
function waveY(x,z,t){
  return Math.sin(x*0.16+t*1.1)*0.68
       + Math.sin(z*0.21+t*0.85)*0.6
       + Math.sin((x+z)*0.11+t*0.6)*0.88
       + Math.sin(x*0.045-t*0.4)*1.4;
}
function updateOcean(t){
  for(var i=0;i<oPos.count;i++){
    oPos.setY(i, waveY(oBase[i*2], oBase[i*2+1], t));
  }
  oPos.needsUpdate=true;
  oceanGeo.computeVertexNormals();
}

/* ═══════════ Pirate ship (silhouette) ═══════════ */
function strawHatJollyRoger(){
  var cv=document.createElement("canvas"); cv.width=256; cv.height=160;
  var g=cv.getContext("2d");
  g.fillStyle="#0a0a0e"; g.fillRect(0,0,256,160);
  g.strokeStyle="rgba(240,199,94,0.35)"; g.lineWidth=5; g.strokeRect(4,4,248,152);
  /* crossbones */
  g.strokeStyle="#e8e5da"; g.lineWidth=13; g.lineCap="round";
  g.beginPath(); g.moveTo(58,138); g.lineTo(198,66); g.stroke();
  g.beginPath(); g.moveTo(58,66); g.lineTo(198,138); g.stroke();
  /* skull */
  g.fillStyle="#efece2";
  g.beginPath(); g.arc(128,76,40,0,6.283); g.fill();
  g.fillRect(108,100,40,24);
  /* eyes + nose */
  g.fillStyle="#0a0a0e";
  g.beginPath(); g.arc(112,74,9,0,6.283); g.fill();
  g.beginPath(); g.arc(144,74,9,0,6.283); g.fill();
  g.beginPath(); g.moveTo(128,88); g.lineTo(121,99); g.lineTo(135,99); g.closePath(); g.fill();
  /* teeth lines */
  g.strokeStyle="#0a0a0e"; g.lineWidth=3;
  for(var tx=114; tx<=142; tx+=7){ g.beginPath(); g.moveTo(tx,104); g.lineTo(tx,122); g.stroke(); }
  /* straw hat */
  g.fillStyle="#e9c25c";
  g.beginPath(); g.ellipse(128,44,58,13,0,0,6.283); g.fill();
  g.beginPath(); g.ellipse(128,34,30,20,0,Math.PI,0); g.fill();
  g.fillStyle="#c23b3b"; g.fillRect(98,36,60,9);
  var t=new THREE.CanvasTexture(cv);
  t.encoding=THREE.sRGBEncoding;
  return t;
}

var ship=new THREE.Group();
var darkMat=new THREE.MeshStandardMaterial({color:0x0d0f16, roughness:0.95});
var sailMat=new THREE.MeshStandardMaterial({color:0x161a26, roughness:1, side:THREE.DoubleSide});
function box(w,h,d,x,y,z){
  var m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d), darkMat);
  m.position.set(x,y,z); ship.add(m); return m;
}
function cyl(r,len,x,y,z,rz){
  var m=new THREE.Mesh(new THREE.CylinderGeometry(r,r,len,8), darkMat);
  m.position.set(x,y,z); if(rz) m.rotation.z=rz; ship.add(m); return m;
}
box(16,3,4.4, 0,1.2,0);            /* hull */
box(3.6,4.4,4.0, 7.6,2.0,0);       /* bow */
box(4.4,5.4,4.2, -7.2,2.6,0);      /* stern castle */
cyl(0.14,7, 11.6,3.8,0, -0.42);    /* bowsprit */
cyl(0.24,17, 2.6,10.2,0);          /* main mast */
cyl(0.20,13, -4.0,8.6,0);          /* rear mast */
cyl(0.10,9.4, 2.6,13.6,0, Math.PI/2);
cyl(0.10,7.6, 2.6,9.4,0, Math.PI/2);
cyl(0.09,7.4, -4.0,11.4,0, Math.PI/2);
function makeSail(w,h,x,y){
  var geo=new THREE.PlaneGeometry(w,h,10,6);
  var p=geo.attributes.position;
  for(var i=0;i<p.count;i++){
    p.setZ(i, Math.cos(p.getX(i)/w*Math.PI)*0.9);
  }
  geo.computeVertexNormals();
  var m=new THREE.Mesh(geo, sailMat);
  m.position.set(x,y,0); ship.add(m); return m;
}
makeSail(8.8,5.6, 2.6,11.0);
makeSail(7.0,4.4, 2.6,6.6);
makeSail(6.8,4.6, -4.0,8.6);
/* flag with straw-hat jolly roger */
var flagGeo=new THREE.PlaneGeometry(3.6,2.2,14,6);
var flagBase=[];
var fp=flagGeo.attributes.position;
for(var fi=0; fi<fp.count; fi++) flagBase.push(fp.getX(fi), fp.getY(fi));
var flag=new THREE.Mesh(flagGeo, new THREE.MeshBasicMaterial({map:strawHatJollyRoger(), side:THREE.DoubleSide, fog:true}));
flag.position.set(2.6+1.9, 19.1, 0);
ship.add(flag);
function waveFlag(t){
  for(var i=0;i<fp.count;i++){
    var x=flagBase[i*2], y=flagBase[i*2+1];
    var k=(x+1.8)/3.6;
    fp.setZ(i, Math.sin(x*2.2+t*7)*0.22*k + Math.sin(y*3+t*5)*0.06*k);
  }
  fp.needsUpdate=true;
}
/* stern lantern */
var lantern=new THREE.Mesh(new THREE.SphereGeometry(0.32,10,8),
  new THREE.MeshBasicMaterial({color:0xffb45e, fog:false}));
lantern.position.set(-9.3,6.2,0); ship.add(lantern);
var lanternLight=new THREE.PointLight(0xff9d45, 0.8, 10);
lanternLight.position.copy(lantern.position); ship.add(lanternLight);

ship.position.set(-20,0,-40);
ship.rotation.y=0.12;
ship.scale.setScalar(0.72);
scene.add(ship);

/* ═══════════ The Mühle board (treasure) ═══════════ */
function boardTexture(){
  var cv=document.createElement("canvas"); cv.width=cv.height=1024;
  var g=cv.getContext("2d"), s=1024/700;
  g.fillStyle="#F7F1E3"; g.fillRect(0,0,1024,1024);
  var gr=g.createRadialGradient(380,300,80,512,512,760);
  gr.addColorStop(0,"#F2A94E"); gr.addColorStop(0.55,"#E08A33"); gr.addColorStop(1,"#CE7524");
  g.fillStyle=gr;
  g.fillRect(18,18,988,988);
  g.strokeStyle="#2A2119"; g.lineWidth=13*s; g.lineCap="round"; g.lineJoin="round";
  [[50,600],[150,400],[250,200]].forEach(function(sq){
    g.strokeRect(sq[0]*s, sq[0]*s, sq[1]*s, sq[1]*s);
  });
  g.beginPath();
  g.moveTo(350*s,50*s);  g.lineTo(350*s,250*s);
  g.moveTo(350*s,450*s); g.lineTo(350*s,650*s);
  g.moveTo(50*s,350*s);  g.lineTo(250*s,350*s);
  g.moveTo(450*s,350*s); g.lineTo(650*s,350*s);
  g.stroke();
  var pts=[[0,0],[3,0],[6,0],[1,1],[3,1],[5,1],[2,2],[3,2],[4,2],[0,3],[1,3],[2,3],
           [4,3],[5,3],[6,3],[2,4],[3,4],[4,4],[1,5],[3,5],[5,5],[0,6],[3,6],[6,6]];
  g.fillStyle="#2A2119";
  pts.forEach(function(p){
    g.beginPath(); g.arc((50+p[0]*100)*s,(50+p[1]*100)*s, 12*s, 0, 6.283); g.fill();
  });
  var t=new THREE.CanvasTexture(cv);
  t.encoding=THREE.sRGBEncoding;
  t.anisotropy=4; return t;
}
var boardGrp=new THREE.Group();
var woodSide=new THREE.MeshStandardMaterial({color:0x6e4218, roughness:0.8});
var topMat=new THREE.MeshStandardMaterial({map:boardTexture(), roughness:0.65});
var board=new THREE.Mesh(new THREE.BoxGeometry(10,0.7,10),
  [woodSide,woodSide,topMat,woodSide,woodSide,woodSide]);
boardGrp.add(board);

/* grid → local coords: gx 0..6  →  (gx/6-0.5)*8.6 */
function bp(gx,gz){ return [(gx/6-0.5)*8.6, (gz/6-0.5)*8.6]; }
var pieceGeo=new THREE.CylinderGeometry(0.56,0.56,0.26,24);
var ivoryMat=new THREE.MeshStandardMaterial({color:0xEFE2BC, roughness:0.45});
var coalMat=new THREE.MeshStandardMaterial({color:0x1b1b20, roughness:0.4, metalness:0.15});
var PIECE_Y=0.35+0.13;
function addPiece(mat,gx,gz,hidden){
  var m=new THREE.Mesh(pieceGeo, mat);
  var p=bp(gx,gz);
  m.position.set(p[0], hidden?9:PIECE_Y, p[1]);
  m.visible=!hidden;
  boardGrp.add(m); return m;
}
/* mill row [15,16,17] → (2,4)(3,4)(4,4) — near side */
var drops=[
  {m:addPiece(ivoryMat,2,4,true), t0:9.2},
  {m:addPiece(ivoryMat,3,4,true), t0:9.9},
  {m:addPiece(ivoryMat,4,4,true), t0:10.6},
  {m:addPiece(coalMat, 0,0,true), t0:8.8},
  {m:addPiece(coalMat, 6,0,true), t0:11.1}
];
addPiece(coalMat,6,3,false);
addPiece(ivoryMat,3,1,false);

/* gold mill beam — a low glowing strip beneath the three pieces */
var millBeam=new THREE.Mesh(new THREE.BoxGeometry(4.3,0.06,0.8),
  new THREE.MeshBasicMaterial({color:0xFFB020, transparent:true, opacity:0, fog:false,
    blending:THREE.AdditiveBlending, depthWrite:false}));
var bpMid=bp(3,4);
millBeam.position.set(bpMid[0], 0.42, bpMid[1]);
boardGrp.add(millBeam);

boardGrp.position.set(0,-5,0);
boardGrp.rotation.y=0.35;
scene.add(boardGrp);

/* ═══════════ Audio (procedural, WebAudio) ═══════════ */
var actx=null, master=null;
function audioInit(){
  try{ actx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return; }
  master=actx.createGain(); master.gain.value=0.8; master.connect(actx.destination);
  /* deep drone */
  [55,58.3].forEach(function(f,i){
    var o=actx.createOscillator(); o.type=i?"sawtooth":"sine"; o.frequency.value=f;
    var lp=actx.createBiquadFilter(); lp.type="lowpass"; lp.frequency.value=170;
    var g=actx.createGain(); g.gain.value=i?0.025:0.06;
    o.connect(lp); lp.connect(g); g.connect(master); o.start();
  });
  /* sea noise */
  var len=actx.sampleRate*2;
  var buf=actx.createBuffer(1,len,actx.sampleRate);
  var d=buf.getChannelData(0);
  for(var i=0;i<len;i++) d[i]=Math.random()*2-1;
  var src=actx.createBufferSource(); src.buffer=buf; src.loop=true;
  var bpf=actx.createBiquadFilter(); bpf.type="bandpass"; bpf.frequency.value=380; bpf.Q.value=0.6;
  var sg=actx.createGain(); sg.gain.value=0.05;
  src.connect(bpf); bpf.connect(sg); sg.connect(master); src.start();
  /* slow swell LFO on sea */
  var lfo=actx.createOscillator(); lfo.frequency.value=0.13;
  var lg=actx.createGain(); lg.gain.value=0.025;
  lfo.connect(lg); lg.connect(sg.gain); lfo.start();
}
function noiseBurst(dur, freq0, freq1, gain){
  if(!actx) return;
  var len=Math.floor(actx.sampleRate*dur);
  var buf=actx.createBuffer(1,len,actx.sampleRate);
  var d=buf.getChannelData(0);
  for(var i=0;i<len;i++) d[i]=(Math.random()*2-1)*(1-i/len);
  var src=actx.createBufferSource(); src.buffer=buf;
  var f=actx.createBiquadFilter(); f.type="lowpass";
  f.frequency.setValueAtTime(freq0, actx.currentTime);
  f.frequency.exponentialRampToValueAtTime(freq1, actx.currentTime+dur);
  var g=actx.createGain(); g.gain.value=gain;
  src.connect(f); f.connect(g); g.connect(master); src.start();
}
function toneAt(f,dur,type,gain,delay){
  if(!actx) return;
  var t=actx.currentTime+(delay||0);
  var o=actx.createOscillator(), g=actx.createGain();
  o.type=type||"sine"; o.frequency.value=f;
  g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(gain,t+0.02);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g); g.connect(master); o.start(t); o.stop(t+dur+0.1);
}
var snd={
  thunder:function(big){ noiseBurst(big?1.6:0.9, big?900:500, 60, big?0.55:0.25); },
  thud:function(){ toneAt(150,0.18,"triangle",0.5); noiseBurst(0.08,900,200,0.12); },
  chime:function(){ toneAt(523,0.16,"triangle",0.22); toneAt(659,0.16,"triangle",0.22,0.14); toneAt(784,0.3,"triangle",0.25,0.28); },
  boom:function(){ toneAt(72,1.6,"sine",0.7); noiseBurst(1.2,500,50,0.4); toneAt(110,1.2,"triangle",0.18,0.05); toneAt(220,2.2,"sine",0.1,0.4); toneAt(330,2.2,"sine",0.07,0.5); }
};

/* ═══════════ Timeline helpers ═══════════ */
function lerp(a,b,u){ return a+(b-a)*u; }
function clamp01(u){ return u<0?0:(u>1?1:u); }
function easeOut(u){ return 1-Math.pow(1-u,3); }
function easeIn(u){ return u*u*u; }
function kf3(t, keys){ /* keys: [[t,[x,y,z]],...] */
  if(t<=keys[0][0]) return keys[0][1];
  for(var i=1;i<keys.length;i++){
    if(t<keys[i][0]){
      var u=(t-keys[i-1][0])/(keys[i][0]-keys[i-1][0]);
      u=u*u*(3-2*u); /* smoothstep */
      var a=keys[i-1][1], b=keys[i][1];
      return [lerp(a[0],b[0],u), lerp(a[1],b[1],u), lerp(a[2],b[2],u)];
    }
  }
  return keys[keys.length-1][1];
}
var CAM_POS=[
  [0,  [0, 3.4, 27]],
  [6,  [0, 2.8, 20]],
  [9,  [2.0, 5.0, 13]],
  [12, [0, 4.6, 10]],
  [16, [0, 7.6, 14.5]],
  [26, [0.6, 7.9, 15.2]]
];
var CAM_TGT=[
  [0,  [-6, 3.5, -28]],
  [5,  [0, 2.5, -20]],
  [8,  [0, 1.2, 0]],
  [13, [0, 1.2, 0]],
  [16, [0, 2.6, -4]],
  [26, [0, 2.6, -4]]
];

var events=[
  {t:0.9,  fn:function(){ bolt(false); }},
  {t:3.6,  fn:function(){ bolt(false); }},
  {t:6.4,  fn:function(){ noiseBurst(2.6, 300, 60, 0.30); }}, /* board surfacing rumble */
  {t:8.8,  fn:function(){ snd.thud(); }},
  {t:9.7,  fn:function(){ snd.thud(); }},
  {t:10.4, fn:function(){ snd.thud(); }},
  {t:11.1, fn:function(){ snd.thud(); }},
  {t:11.6, fn:function(){ snd.thud(); snd.chime(); }},
  {t:12.3, fn:function(){ bolt(true); }},
  {t:12.7, fn:function(){ snd.boom(); document.getElementById("titleWrap").classList.add("show"); }},
  {t:15.0, fn:function(){ document.getElementById("playBtn").classList.add("show"); }}
];

/* lightning — decay is wall-time based so it looks identical at any frame rate */
var flashEl=document.getElementById("flash");
var nextRandomBolt=17;
var boltPeak=0, boltT=-9;
function bolt(big){
  boltPeak=big?5:2.5; boltT=(performance.now()/1000)-t0;
  boltLight.position.set(-30+Math.random()*60, 40+Math.random()*15, -60+Math.random()*25);
  flashEl.style.transition="none";
  flashEl.style.opacity=big?0.45:0.18;
  requestAnimationFrame(function(){
    flashEl.style.transition="opacity .45s ease-out";
    flashEl.style.opacity=0;
  });
  setTimeout(function(){ snd.thunder(big); }, big?260:480);
}

/* ═══════════ Main loop ═══════════ */
var started=false, t0=0, tPrev=0;
function tick(now){
  requestAnimationFrame(tick);
  var t=(now/1000)-t0;
  var dt=Math.min(0.1, t-tPrev); tPrev=t;
  window.__t=t;

  updateOcean(t*0.9);
  waveFlag(t);

  /* ship sails across the horizon, bobbing on the swell */
  var sx=lerp(-20, 26, clamp01(t/30));
  ship.position.x=sx;
  ship.position.y=waveY(sx,-40,t*0.9)*0.4 - 0.3;
  ship.rotation.z=Math.sin(t*0.55)*0.045;
  ship.rotation.x=Math.sin(t*0.4+1)*0.03;
  lanternLight.intensity=0.7+Math.sin(t*9)*0.15+Math.random()*0.12;

  clouds.forEach(function(c){
    c.m.position.x+=c.v*dt;
    if(c.m.position.x>110) c.m.position.x=-110;
  });

  /* board rises from the deep 6.5s→9.3s */
  var bu=clamp01((t-6.5)/2.8);
  boardGrp.position.y=lerp(-5, 1.15, easeOut(bu));
  if(bu>0 && bu<1) boardGrp.position.y+=Math.sin(t*14)*0.05*(1-bu); /* shudder */
  boardGrp.rotation.y=0.35+Math.max(0,t-9.3)*0.035;

  /* dropping pieces */
  drops.forEach(function(dr){
    if(t<dr.t0){ return; }
    dr.m.visible=true;
    var u=clamp01((t-dr.t0)/0.55);
    var y=lerp(9, PIECE_Y, easeIn(u));
    if(u>=1){
      var b=clamp01((t-dr.t0-0.55)/0.3);
      y=PIECE_Y+Math.abs(Math.sin(b*Math.PI))*0.18*(1-b);
    }
    dr.m.position.y=y;
  });

  /* gold mill beam + light: pulses after 11.6 */
  if(t>11.6){
    var mp=Math.max(0, Math.sin((t-11.6)*5)) * Math.max(0, 1-(t-11.6)/4.5);
    millBeam.material.opacity=mp*0.5;
    goldLight.intensity=mp*3 + (t>12.7? 0.25:0); /* keep faint warm glow for title */
  }

  /* lightning decay (time-based) + occasional ambient bolts */
  boltLight.intensity=boltPeak*Math.exp(-(t-boltT)*5.5);
  if(t>nextRandomBolt){ bolt(false); nextRandomBolt=t+4+Math.random()*5; }

  /* events */
  events.forEach(function(ev){ if(!ev.done && t>=ev.t){ ev.done=true; ev.fn(); } });

  /* camera */
  var cp=kf3(t, CAM_POS), ct=kf3(t, CAM_TGT);
  camera.position.set(cp[0], cp[1]+Math.sin(t*0.7)*0.12, cp[2]);
  camera.lookAt(ct[0], ct[1], ct[2]);

  renderer.render(scene, camera);
}

/* ═══════════ Start gate ═══════════ */
var gate=document.getElementById("gate");
function start(){
  if(started) return;
  started=true;
  audioInit();
  gate.classList.add("hide");
  document.getElementById("skip").classList.add("show");
  t0=performance.now()/1000;
  requestAnimationFrame(tick);
}
gate.addEventListener("pointerdown", start);
document.getElementById("playBtn").addEventListener("pointerdown", function(){ location.href="index.html"; });

/* pre-render one dark frame behind the gate */
renderer.render(scene,camera);

/* allow automated testing: ?autoplay=1 starts immediately */
if(/[?&]autoplay=1/.test(location.search)) start();
})();
</script>
</body>
</html>
